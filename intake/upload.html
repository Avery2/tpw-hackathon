<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read the packet — TPW Collective Impact</title>
<meta name="description" content="Drop a RIGHT 4.0 application packet and read the organization's own answers back out of it: legal name, signatory, program, institutions and populations. Nothing is uploaded.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23fff'/><text y='72' x='50' text-anchor='middle' font-size='54' font-family='monospace' fill='%235d8d67'>T</text></svg>">
<style>
  @font-face { font-family:'Rubik One'; src:url('../assets/fonts/rubik-one.woff2') format('woff2'); font-weight:400; font-display:swap; }
  @font-face { font-family:'Degular'; src:url('../assets/fonts/degular-text-500.woff2') format('woff2'); font-weight:400 500; font-display:swap; }
  @font-face { font-family:'Degular'; src:url('../assets/fonts/degular-text-700.woff2') format('woff2'); font-weight:700 800; font-display:swap; }

  :root {
    --ink:#101010; --body:#3e3e3e; --muted:#6f6b66; --faint:#9a958e;
    --rule:#e6e3dd; --rule-2:#d5d1c9; --card:#f8f7f4;
    --accent:#5d8d67; --accent-dark:#42674b; --accent-soft:#eef4ef;
    --bad:#a8432f; --bad-soft:#fbeeea; --warn:#8a6a1f; --warn-soft:#fbf5e4;
    --sans:'Degular', ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --display:'Rubik One', 'Arial Black', ui-sans-serif, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; color:var(--body); font-family:var(--sans); font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 26px 22px 100px; }

  /* The same header the member site uses, so the flow never feels like a different site. */
  .site-header { display:flex; align-items:center; justify-content:space-between; gap:32px;
    max-width:1440px; margin:0 auto; padding:26px 40px; }
  .site-header .logo img { width:190px; display:block; }
  .site-header nav { display:flex; align-items:center; gap:38px; font-size:17px; }
  .site-header nav a { color:inherit; text-decoration:none; }
  .site-header nav a:hover { text-decoration:underline; text-underline-offset:5px; text-decoration-thickness:2px; }
  .site-header nav a.login { font-weight:700; }
  .site-header nav a.login:hover, .site-header nav a[aria-current="page"] { color:var(--accent-dark); }
  @media (max-width:900px) {
    .site-header { flex-wrap:wrap; gap:16px; padding:18px 22px; }
    .site-header .logo img { width:128px; }
    .site-header nav { width:100%; flex-wrap:wrap; gap:12px 20px; font-size:15px; }
  }
  .site-foot { max-width:1440px; margin:0 auto; padding:0 40px 46px; font-size:13px; color:#797979; }

  h1 { font-family:var(--display); font-weight:400; color:var(--ink); font-size:clamp(1.7rem, 6vw, 2.3rem); line-height:1.08; margin:0 0 10px; }
  h2 { font-size:11px; letter-spacing:.17em; text-transform:uppercase; color:var(--muted); font-weight:700; margin:44px 0 12px; }
  h3 { font-size:15px; color:var(--ink); margin:26px 0 10px; }
  .lede { color:var(--muted); margin:0 0 26px; font-size:16px; }
  .note { font-size:13.5px; color:var(--muted); border-left:3px solid var(--accent); padding-left:12px; margin:0 0 24px; }
  a { color:var(--accent-dark); }

  .drop {
    border:1.5px dashed var(--rule-2); border-radius:14px; padding:40px 22px; text-align:center;
    background:var(--card); cursor:pointer; transition:border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color:var(--accent); background:var(--accent-soft); }
  .drop b { display:block; color:var(--ink); font-size:17px; margin-bottom:4px; }
  .drop span { color:var(--muted); font-size:13.5px; }
  input[type=file] { display:none; }

  ul.plain { list-style:none; margin:0; padding:0; }
  .doc { display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--rule); }
  .doc:last-child { border-bottom:0; }
  .doc .mark { width:19px; flex:0 0 19px; text-align:center; font-size:13px; line-height:1.6; color:var(--faint); }
  .doc .mark.on { color:var(--good, #3d7a4c); }
  .doc.off .what { color:var(--faint); }
  .doc .what { flex:1; min-width:0; }
  .doc .name { color:var(--ink); font-weight:700; font-size:15px; }
  .doc .opt { font-weight:400; color:var(--faint); font-size:12.5px; margin-left:6px; }
  .doc .why { color:var(--muted); font-size:13px; }
  .doc .pages { color:var(--faint); font-size:12.5px; font-family:var(--mono); white-space:nowrap; }
  .doc select { font:inherit; font-size:13px; padding:5px 8px; border:1px solid var(--rule-2); border-radius:7px; background:#fff; color:var(--ink); max-width:150px; }

  .field { margin-bottom:18px; }
  .field.half { display:inline-block; width:calc(50% - 8px); vertical-align:top; }
  .field.half + .field.half { margin-left:12px; }
  label { display:block; font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:6px; }
  label .opt { font-weight:400; color:var(--faint); margin-left:5px; }
  input[type=text], input[type=date], input[type=number], select, textarea {
    width:100%; font-family:var(--sans); font-size:16.5px; color:var(--ink);
    background:#fff; border:1px solid var(--rule-2); border-radius:10px; padding:12px 13px; -webkit-appearance:none;
  }
  textarea { min-height:76px; resize:vertical; line-height:1.45; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  select { appearance:none; background-image:linear-gradient(45deg,transparent 50%,#8a867f 50%),linear-gradient(135deg,#8a867f 50%,transparent 50%);
           background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  .help { color:var(--muted); font-size:12.5px; margin:5px 0 0; }

  .badge { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-family:var(--mono); color:var(--muted); margin-left:8px; font-weight:400; }
  .badge .dot { width:6px; height:6px; border-radius:50%; background:var(--faint); }
  .badge.high .dot { background:#3d7a4c; }
  .badge.medium .dot { background:#b98a2a; }
  .badge.low .dot { background:var(--faint); }
  .local { font-size:11.5px; color:var(--faint); font-family:var(--mono); margin-left:6px; }
  .conflict { font-size:12.5px; color:var(--warn); background:var(--warn-soft); border-radius:7px; padding:6px 9px; margin-top:6px; }

  button.primary {
    width:100%; margin-top:10px; font-family:var(--sans); font-size:17px; font-weight:700;
    color:#fff; background:var(--accent); border:0; border-radius:999px; padding:15px 24px; cursor:pointer;
  }
  button.primary:hover { background:var(--accent-dark); }
  button.primary:disabled { opacity:.45; cursor:not-allowed; }
  .alts { margin-top:14px; display:flex; gap:16px; flex-wrap:wrap; font-size:13.5px; }
  .alts button, .alts a { background:none; border:0; padding:0; color:var(--muted); text-decoration:underline; cursor:pointer; font:inherit; font-size:13.5px; }
  .alts button:hover, .alts a:hover { color:var(--ink); }

  .stats { display:flex; gap:10px; flex-wrap:wrap; margin:0 0 8px; }
  .stat { flex:1 1 130px; border:1px solid var(--rule); border-radius:12px; padding:13px 15px; background:var(--card); }
  .stat b { display:block; font-family:var(--mono); font-size:1.5rem; color:var(--ink); font-weight:500; letter-spacing:-.03em; }
  .stat span { font-size:12.5px; color:var(--muted); }

  .grid { width:100%; border-collapse:collapse; font-size:14px; }
  .grid th { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); text-align:center; padding:6px 4px; font-weight:700; }
  .grid th:first-child { text-align:left; }
  .grid td { border-top:1px solid var(--rule); padding:6px 4px; text-align:center; }
  .grid td:first-child { text-align:left; font-size:13.5px; color:var(--ink); }
  .grid input { accent-color:var(--accent); width:16px; height:16px; }
  .grid .star { color:#b98a2a; font-weight:700; }
  .grid tr.extra { display:none; }
  .grid.showall tr.extra { display:table-row; }

  .points { border:1px solid var(--rule); border-radius:12px; padding:16px 18px; background:var(--card); }
  .points .total { font-family:var(--mono); font-size:1.9rem; color:var(--ink); font-weight:500; }
  .points ul { margin:8px 0 0; padding:0 0 0 18px; font-size:13.5px; color:var(--muted); }
  .points li { margin-bottom:3px; }

  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff;
           padding:11px 18px; border-radius:9px; font-size:14px; max-width:92vw; z-index:40; box-shadow:0 10px 30px rgba(0,0,0,.2); }
  .toast.bad { background:var(--bad); }
  .toast.good { background:var(--accent-dark); }

  .done { text-align:center; padding:44px 0 16px; }
  .done .mark { width:56px; height:56px; border-radius:50%; background:var(--accent-soft); color:var(--accent-dark);
                display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:26px; }
  .done h2 { font-family:var(--display); font-size:1.5rem; margin:0 0 8px; color:var(--ink); text-transform:none; letter-spacing:0; }
  .done p { color:var(--muted); margin:0 0 22px; }
  .done button { width:auto; padding:12px 26px; }

  details { margin-top:14px; }
  summary { cursor:pointer; font-size:13px; color:var(--muted); }
  pre { background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:14px; overflow:auto;
        font-family:var(--mono); font-size:12px; line-height:1.5; max-height:340px; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--rule-2); border-top-color:var(--accent);
             border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:8px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (max-width: 560px) {
    .field.half { width:100%; }
    .field.half + .field.half { margin-left:0; }
    .grid td:first-child { font-size:12.5px; }
  }
.internal-bar { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  background: #101010; color: #fff; font-size: 13px; padding: 9px 16px; text-align: center; line-height: 1.35; }
.internal-bar b { background: #edca72; color: #000; font-weight: 700; text-transform: uppercase;
  letter-spacing: .1em; font-size: 10px; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.internal-bar span { opacity: .82; max-width: 74ch; }
</style>
</head>
<header class="site-header">
  <a class="logo" href="../index.html"><img src="../assets/img/logo.png" alt="Transformative Programming Works"></a>
  <nav>
    <a href="../site/our-members/">Our Members</a>
    <a href="../site/ourstory/">Our Story</a>
    <a href="../site/ourwork/">Our Work</a>
    <a href="../site/our-team/">Our Team</a>
    <a href="../dashboard/">Dashboard</a>
    <a class="login" href="simple.html" aria-current="page">Members Login</a>
  </nav>
</header>
<div class="wrap">
  <div id="app"><p class="lede">Loading…</p></div>
</div>
<p class="site-foot">Internal prototype, demo build &mdash; the packet is read in this browser and never uploaded; only the facts you approve are saved to a GitHub repository.</p>
<script type="module" src="js/upload.js"></script>
</body>
</html>
