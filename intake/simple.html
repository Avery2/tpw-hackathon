<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick entry — TPW Collective Impact</title>
<meta name="description" content="Three small forms: a weekly log, an aggregate totals entry, and a release follow-up. No steps, no account.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23fff'/><text y='72' x='50' text-anchor='middle' font-size='54' font-family='monospace' fill='%235d8d67'>T</text></svg>">
<style>
  @font-face { font-family:'Rubik One'; src:url('../assets/fonts/rubik-one.woff2') format('woff2'); font-weight:400; font-display:swap; }
  @font-face { font-family:'Degular'; src:url('../assets/fonts/degular-text-500.woff2') format('woff2'); font-weight:400 500; font-display:swap; }
  @font-face { font-family:'Degular'; src:url('../assets/fonts/degular-text-700.woff2') format('woff2'); font-weight:700 800; font-display:swap; }

  :root {
    --ink:#101010; --body:#3e3e3e; --muted:#6f6b66; --faint:#9a958e;
    --rule:#e6e3dd; --rule-2:#d5d1c9; --card:#f8f7f4;
    --accent:#5d8d67; --accent-dark:#42674b; --accent-soft:#eef4ef;
    --bad:#a8432f; --good:#3d7a4c;
    --sans:'Degular', ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --display:'Rubik One', 'Arial Black', ui-sans-serif, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:#fff; color:var(--body);
    font-family:var(--sans); font-size:17px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 26px 22px 90px; }

  header { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:40px; }
  header img { width: 96px; display:block; }
  header a.back { font-size:13.5px; color:var(--muted); text-decoration:none; margin-left:16px; }
  header a.back:hover { color:var(--ink); }

  .tabs { display:flex; gap:6px; margin-bottom:34px; flex-wrap:wrap; }
  .tabs a {
    text-decoration:none; font-size:14.5px; color:var(--muted);
    padding:7px 15px; border-radius:999px; border:1px solid transparent;
  }
  .tabs a:hover { color:var(--ink); background:var(--card); }
  .tabs a[aria-current="page"] { color:#fff; background:var(--accent); font-weight:700; }

  h1 {
    font-family:var(--display); font-weight:400; color:var(--ink);
    font-size:clamp(1.7rem, 6vw, 2.3rem); line-height:1.08; margin:0 0 8px;
  }
  .lede { color:var(--muted); margin:0 0 30px; font-size:16px; }

  form { display:grid; grid-template-columns: 1fr 1fr; column-gap: 12px; align-items:start; }
  form > * { grid-column: 1 / -1; }
  .field { margin-bottom:20px; }
  .field.half { grid-column: span 1; }
  label { display:block; font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:6px; }
  label .opt { font-weight:400; color:var(--faint); margin-left:5px; }

  input[type=text], input[type=date], input[type=number], select, textarea {
    width:100%; font-family:var(--sans); font-size:17px; color:var(--ink);
    background:#fff; border:1px solid var(--rule-2); border-radius:10px;
    padding:13px 14px; -webkit-appearance:none;
  }
  textarea { min-height:72px; resize:vertical; line-height:1.45; }
  select { appearance:none; background-image:linear-gradient(45deg,transparent 50%,#8a867f 50%),linear-gradient(135deg,#8a867f 50%,transparent 50%);
           background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  input::placeholder, textarea::placeholder { color:var(--faint); }
  input.invalid, textarea.invalid { border-color:var(--bad); }
  .err { color:var(--bad); font-size:13px; margin:6px 0 0; }
  .help { color:var(--muted); font-size:13px; margin:6px 0 0; }

  .multi { display:flex; gap:8px; }
  .multi input { flex:1; }
  .multi .addbtn {
    font:inherit; font-size:14.5px; font-weight:700; padding:0 18px; border-radius:10px;
    border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent-dark); cursor:pointer;
  }
  .multi .addbtn:hover { background:var(--accent); color:#fff; }
  .picked { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .pickedchip {
    display:inline-flex; align-items:center; gap:6px; font-size:14px;
    background:var(--accent-soft); color:var(--accent-dark); border:1px solid #d9e6dc;
    border-radius:999px; padding:5px 8px 5px 12px;
  }
  .pickedchip button { background:none; border:0; color:var(--accent-dark); font-size:16px; line-height:1; cursor:pointer; padding:0 2px; }

  .choices { display:flex; gap:8px; flex-wrap:wrap; }
  .choices label {
    display:flex; align-items:center; gap:8px; margin:0;
    border:1px solid var(--rule-2); border-radius:999px; padding:10px 16px;
    font-weight:500; font-size:15px; cursor:pointer; color:var(--body);
  }
  .choices input { accent-color:var(--accent); margin:0; }
  .choices label:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); color:var(--ink); font-weight:700; }

  button.primary {
    width:100%; margin-top:12px; font-family:var(--sans); font-size:17px; font-weight:700;
    color:#fff; background:var(--accent); border:0; border-radius:999px; padding:15px 24px;
    cursor:pointer;
  }
  button.primary:hover { background:var(--accent-dark); }
  button.primary:disabled { opacity:.45; cursor:not-allowed; }

  .alts { margin-top:16px; display:flex; gap:16px; flex-wrap:wrap; font-size:13.5px; }
  .alts button, .alts a { background:none; border:0; padding:0; color:var(--muted); text-decoration:underline; cursor:pointer; font:inherit; font-size:13.5px; }
  .alts button:hover, .alts a:hover { color:var(--ink); }

  .recent { margin-top:54px; border-top:1px solid var(--rule); padding-top:20px; }
  .recent h2 { font-size:10.5px; letter-spacing:-0.1em; text-transform:uppercase; letter-spacing:.17em; color:var(--muted); font-weight:700; margin:0 0 12px; }
  .recent ul { list-style:none; margin:0; padding:0; }
  .recent li { display:flex; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px solid var(--rule); font-size:14px; }
  .recent li:last-child { border-bottom:0; }
  .recent .when { color:var(--muted); font-size:12.5px; white-space:nowrap; }
  .recent .empty { color:var(--muted); font-size:14px; padding:6px 0; }

  .done { text-align:center; padding:52px 0 20px; }
  .done .mark { width:56px; height:56px; border-radius:50%; background:var(--accent-soft); color:var(--accent-dark); display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:26px; }
  .done h2 { font-family:var(--display); font-weight:400; font-size:1.5rem; color:var(--ink); margin:0 0 8px; }
  .done p { color:var(--muted); margin:0 0 24px; }
  .done a { color:var(--accent-dark); }
  .done button { width:auto; padding:12px 26px; }

  .note { font-size:13px; color:var(--muted); border-left:3px solid var(--accent); padding-left:12px; margin:0 0 26px; }
  .toast {
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:9px;
    font-size:14px; max-width:92vw; z-index:40; box-shadow:0 10px 30px rgba(0,0,0,.2);
  }
  .toast.bad { background:var(--bad); }
  .toast.good { background:var(--accent-dark); }
  @media (max-width: 520px) {
    form { grid-template-columns: 1fr; }
    .field.half { grid-column: 1 / -1; }
  }
.internal-bar { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  background: #101010; color: #fff; font-size: 13px; padding: 9px 16px; text-align: center; line-height: 1.35; }
.internal-bar b { background: #edca72; color: #000; font-weight: 700; text-transform: uppercase;
  letter-spacing: .1em; font-size: 10px; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.internal-bar span { opacity: .82; max-width: 74ch; }
</style>
</head>
<body>
<div class="internal-bar">
  <b>Internal</b>
  <span>For TPW member organizations only &mdash; this is not a public form. Demo build: entries are saved to a GitHub repository, not sent to CDCR.</span>
</div>
<div class="wrap">
  <header>
    <a href="index.html"><img src="../assets/img/logo.png" alt="Transformative Programming Works"></a>
    <a class="back" href="sheet.html">Print a sheet</a>
    <a class="back" href="scan.html">Scan</a>
    <a class="back" href="index.html">Full intake →</a>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <div id="app"><p class="lede">Loading…</p></div>
</div>
<script type="module" src="js/simple.js"></script>
</body>
</html>
