<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Enter the TPW member demo workspace.">
<title>Members Login — TPW</title>
<link rel="stylesheet" href="../assets/site-shell.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; color: #111; font: 18px/1.5 'Degular', sans-serif; }
</style>
<script type="module" src="../assets/site-shell.js"></script>
</head>
<body>
<header class="site-header">
  <a class="logo" href="../"><img src="../assets/img/logo.png" width="220" alt="Transformative Programming Works"></a>
  <nav aria-label="Main navigation">
    <a href="../site/our-members/">Our Members</a>
    <a href="../site/ourstory/">Our Story</a>
    <a href="../site/ourwork/">Our Work</a>
    <a href="../site/our-team/">Our Team</a>
    <a href="./" aria-current="page">Members Login</a>
  </nav>
</header>
<main class="member-login">
  <section class="login-card" aria-labelledby="login-heading">
    <h1 id="login-heading">Members Login</h1>
    <p class="login-intro">Your programs, reporting and collective impact, in one place.</p>
    <form id="member-login" aria-describedby="login-note">
      <label for="demo-account">Demo account</label>
      <select id="demo-account" name="account" required>
        <option value="" disabled selected>Choose an account</option>
        <option value="org-1">Org 1</option>
        <option value="org-2">Org 2</option>
        <option value="tpw">TPW View</option>
      </select>
      <button type="submit">Continue to demo workspace →</button>
    </form>
    <p id="login-note" class="login-note">Demo access only, not authentication. Member sign-in is not connected in this prototype. No email or password is collected. Use synthetic data only.</p>
    <noscript><p>This demo workspace needs JavaScript enabled.</p></noscript>
  </section>
</main>
<script type="module">
import { getDemoAccount, setDemoAccount } from '../assets/member-session.js';
const select = document.querySelector('#demo-account');
const previous = getDemoAccount();
if (previous) select.value = previous;
document.querySelector('#member-login').addEventListener('submit', event => {
  event.preventDefault();
  if (!setDemoAccount(select.value)) return;
  location.assign(`../dashboard/#${select.value}`);
});
</script>
</body>
</html>
