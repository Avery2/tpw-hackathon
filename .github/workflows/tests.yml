name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:neon
      - run: npx playwright install --with-deps chromium
      - name: Test the built app in Chromium
        run: |
          npm start -- --hostname 127.0.0.1 > "$RUNNER_TEMP/next.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat "$RUNNER_TEMP/next.log"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/team-dashboard/; then
              npm run test:browser
              exit
            fi
            sleep 1
          done
          exit 1
