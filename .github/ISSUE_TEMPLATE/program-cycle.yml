name: Program cycle
description: File one program cycle by hand. The form at /intake/ is easier — it validates as you type.
title: "[intake] "
labels: ["intake"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is read by `.github/workflows/intake.yml`. If the payload validates, the
        workflow commits `data/intake/cycles/<id>.json` and closes the issue.

        **Prefer the form:** open `/intake/` on the published site, fill it in, and choose
        *Submit via GitHub issue* — it writes the payload below for you.
  - type: textarea
    id: payload
    attributes:
      label: Cycle payload
      description: The JSON object produced by the intake form, or written by hand against `data/intake/schema.json`.
      render: json
      placeholder: |
        {
          "id": "grip-training-institute-guiding-rage-into-power-sq-2026-01-12-a1b2c3",
          "schema": "tpw.intake/1",
          "source": "intake",
          "org": "GRIP Training Institute",
          "program": "Guiding Rage Into Power",
          "facility": "San Quentin Rehabilitation Center (SQ)",
          "status": "Completed",
          "start_date": "2026-01-12",
          "end_date": "2026-06-30",
          "course_hours": 104,
          "participants_started": 32,
          "participants_completed": 27,
          "join": { "spine_version": "tpw.join/1", "tokens": [] }
        }
    validations:
      required: true
  - type: checkboxes
    id: attestation
    attributes:
      label: Attestation
      options:
        - label: This payload contains no names, CDCR numbers, dates of birth, or other direct identifiers.
          required: true
        - label: I am authorized to report on behalf of this organization.
          required: true
